<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЁжGame Online</title><style>
*{box-sizing:border-box}body{margin:0;padding:15px;background:#111315;color:#eee;font:15px system-ui}main{max-width:720px;margin:auto}.gold{color:#e7bd62}.card{background:#1c2022;border:1px solid #393b39;border-radius:15px;padding:15px;margin:12px 0}.row,.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #555;background:#292d2e;color:white}input{min-width:0;flex:1}button{cursor:pointer}.primary{background:#bd903e;color:#17130b;font-weight:bold}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.player{text-align:center;background:#292d2e;padding:10px;border-radius:10px}.face{font-size:27px}.timer{font-size:27px;color:#e7bd62}.muted{color:#aaa;font-size:13px}.winner{text-align:center;color:#f2cb75;font-size:19px;min-height:28px}.hidden{display:none!important}</style><main>
<div class="top"><h1>🦔 Ёж<span class="gold">Game</span></h1><b id="balance">Баланс: —</b></div>
<section id="entry" class="card"><h3>Играть с другом</h3><p class="muted">Создай комнату и отправь другу код или ссылку.</p><div class="row"><input id="name" value="Ёжик" placeholder="Имя"><button class="primary" id="create">Создать комнату</button></div><div class="row" style="margin-top:9px"><input id="code" placeholder="Код комнаты" maxlength="6"><button id="join">Войти</button></div><p id="msg" class="muted"></p></section>
<section id="game" class="hidden"><div class="card"><div class="row"><b>Комната <span class="gold" id="room"></span></b><button id="copy">Скопировать ссылку</button></div><div class="row"><span>Банк: <b id="pot" class="gold">0</b> 🪙</span><span>Раунд: <b id="round">1</b></span><b class="timer" id="timer">30</b></div><p id="phase" class="muted">Приём ставок</p><div id="winner" class="winner"></div></div>
<div class="card"><b>Участники</b><div id="players" class="players"></div></div><div class="card"><b>Твоя ставка</b><div class="row"><input id="bet" type="number" value="100" min="1"><button id="place" class="primary">Поставить 🪙</button></div></div></section>
<p class="muted">Только виртуальные монеты. Это стартовая онлайн-версия: данные комнат хранятся в памяти сервера.</p></main>
<script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=id=>document.getElementById(id);let me="",room="";
function enter(c){room=c;$("entry").classList.add("hidden");$("game").classList.remove("hidden");$("room").textContent=c;history.replaceState(null,"","?room="+c)}
$("create").onclick=()=>s.emit("room:create",{name:$("name").value},r=>{if(!r.ok)$("msg").textContent=r.error});
$("join").onclick=()=>s.emit("room:join",{name:$("name").value,code:$("code").value},r=>{if(!r.ok)$("msg").textContent=r.error});
s.on("room:joined",d=>{me=d.you;enter(d.code)});
s.on("room:update",r=>{$("pot").textContent=r.pot;$("timer").textContent=r.seconds;$("round").textContent=r.round;$("phase").textContent=r.phase==="betting"?"Приём ставок":"Ставки закрыты · выбираем победителя";$("winner").textContent=r.winner?"🏆 "+r.winner.face+" "+r.winner.name+" выиграл "+r.winner.pot+" 🪙":"";let p=r.players.find(x=>x.id===me);if(p){$("balance").textContent="Баланс: "+p.balance+" 🪙";$("place").disabled=!!p.bet||r.phase!=="betting"}$("players").innerHTML=r.players.map(p=>'<div class="player"><div class="face">'+p.face+'</div><b>'+p.name.replace(/[&<>"]/g,"")+'</b><div>'+p.bet+' 🪙</div>'+(p.id===me?"<small>Это ты</small>":"")+"</div>").join("")});
$("place").onclick=()=>s.emit("bet:place",{amount:$("bet").value},r=>{if(!r.ok)alert(r.error)});
$("copy").onclick=()=>{let u=location.origin+"?room="+room;if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>alert("Ссылка скопирована"));else alert("Код комнаты: "+room)};
let invite=new URLSearchParams(location.search).get("room");if(invite){$("code").value=invite;$("name").value="Друг"}
</script></html>
